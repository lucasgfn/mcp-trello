[project]
name = "trello-org-mcp"
version = "0.1.0"
description = "Servidor MCP do Trello para organizações (Workspaces)"
readme = "README.md"
authors = [
    { name = "Lucas Falcade", email = "10042797950@edu.udesc.br" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
]

[project.scripts]
trello-org-mcp = "trello_org_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = ["e2e: testes contra a API real do Trello (exigem TRELLO_E2E=1)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
